name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Build portable package
        run: pwsh -File ./build_win.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-office-toolkit-windows-x64
          path: dist/pdf-office-toolkit-windows-x64.zip

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pdf-office-toolkit-windows-x64.zip
