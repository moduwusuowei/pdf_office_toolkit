# 在 GitHub 的 Windows runner 上构建安装版 setup.exe。
# 手动触发：仓库页面 → Actions → Build installer → Run workflow。
# 与 build.yml 相互独立，不影响绿色版流程。
name: Build installer

on:
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build app + installer
        shell: pwsh
        run: .\build_installer.ps1

      - name: Upload setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: pdf-office-toolkit-setup
          path: dist/pdf-office-toolkit-setup-x64.exe
          retention-days: 14

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: pdf-office-toolkit-portable
          path: dist/pdf-office-toolkit-windows-x64.zip
          retention-days: 14
